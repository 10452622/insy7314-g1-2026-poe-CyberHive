name: hustlehub

services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/hustlehub
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET before starting Compose}"
      JWT_EXPIRES_IN: 1h
      USE_HTTPS: "false"
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY before starting Compose}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -Y
        - "off"
        - -q
        - --spider
        - http://127.0.0.1/
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo-data: