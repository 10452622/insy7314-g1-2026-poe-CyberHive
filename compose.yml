name: hustlehub

services:
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/hustlehub
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the HustleHub+ .env file}"
      JWT_EXPIRES_IN: 1h
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  mongo-data: