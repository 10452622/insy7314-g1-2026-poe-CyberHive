name: HustleHub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-stack:
    name: Docker stack and backend tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: HustleHub+

    env:
      COMPOSE_BAKE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate temporary CI secrets
        run: |
          jwt=$(openssl rand -hex 32)
          totp=$(openssl rand -hex 32)

          echo "::add-mask::$jwt"
          echo "::add-mask::$totp"

          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "TOTP_ENCRYPTION_KEY=$totp" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        id: image-build
        run: docker compose build --pull

      - name: Start MongoDB and wait for readiness
        run: docker compose up -d --wait --wait-timeout 120 mongo

      - name: Start backend and frontend and wait for readiness
        run: docker compose up -d --no-build --wait --wait-timeout 180 backend frontend

      - name: Check backend responds
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 10 \
            http://127.0.0.1:5000/

      - name: Check frontend responds
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 10 \
            http://127.0.0.1:8080/

      - name: Run backend Postman tests
        run: |
          echo '{"name":"CI","values":[{"key":"baseUrl","value":"http://127.0.0.1:5000","enabled":true}]}' > "$RUNNER_TEMP/hustlehub-ci.postman_environment.json"

          npx --yes --package=newman@6.2.1 newman run \
            "backend/newman-tests/HustleHub+2.postman_collection.json" \
            --environment "$RUNNER_TEMP/hustlehub-ci.postman_environment.json" \
            --timeout-request 15000 \
            --reporters cli,junit \
            --reporter-junit-export "$RUNNER_TEMP/backend-tests.xml"

      - name: Save backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: ${{ runner.temp }}/backend-tests.xml
          if-no-files-found: warn

      - name: Scan backend image
        if: ${{ !cancelled() && steps.image-build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: hustlehub-backend:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          hide-progress: true

      - name: Scan frontend image
        if: ${{ !cancelled() && steps.image-build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: hustlehub-frontend:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          hide-progress: true

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Show MongoDB startup logs
        if: always()
        run: docker compose logs --no-color --tail=200 mongo

      - name: Show application logs
        if: always()
        run: docker compose logs --no-color --tail=100 backend frontend

      - name: Clean up CI containers and database
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependency-security:
    name: ${{ matrix.app }} dependency security
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]

    defaults:
      run:
        working-directory: HustleHub+/${{ matrix.app }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  secret-security:
    name: Scan source for secrets
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan source for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          hide-progress: true