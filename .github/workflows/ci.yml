name: HustleHub CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build backend image
        working-directory: HustleHub+
        run: docker build -t hustlehub-backend ./backend

      - name: Build frontend image
        working-directory: HustleHub+
        run: docker build -t hustlehub-frontend ./frontend