name: HustleHub CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-stack:
    name: Build and check Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: HustleHub+

    env:
      COMPOSE_BAKE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate temporary CI signing secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Start MongoDB and wait for readiness
        run: docker compose up -d --wait --wait-timeout 120 mongo

      - name: Start backend and frontend
        run: docker compose up -d --no-build backend frontend

      - name: Check backend responds
        run: curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused --max-time 10 http://localhost:5000/

      - name: Check frontend responds
        run: curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused --max-time 10 http://localhost:8080/

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Show MongoDB startup logs
        if: always()
        run: docker compose logs --no-color --tail=200 mongo

      - name: Show application logs
        if: always()
        run: docker compose logs --no-color --tail=100 backend frontend

      - name: Clean up CI containers and database
        if: always()
        run: docker compose down --volumes --remove-orphans