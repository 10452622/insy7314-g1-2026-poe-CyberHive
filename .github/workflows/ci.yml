name: HustleHub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-stack:
    name: Build and check Docker stack
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: HustleHub+

    env:
      COMPOSE_BAKE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate temporary CI secrets
        run: |
          jwt=$(openssl rand -hex 32)
          totp=$(openssl rand -hex 32)

          echo "::add-mask::$jwt"
          echo "::add-mask::$totp"

          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "TOTP_ENCRYPTION_KEY=$totp" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build --pull

      - name: Start MongoDB and wait for readiness
        run: docker compose up -d --wait --wait-timeout 120 mongo

      - name: Start backend and frontend and wait for readiness
        run: docker compose up -d --no-build --wait --wait-timeout 180 backend frontend

      - name: Check backend responds
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 10 \
            http://127.0.0.1:5000/

      - name: Check frontend responds
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            --max-time 10 \
            http://127.0.0.1:8080/

      - name: Show container status
        if: always()
        run: docker compose ps -a

      - name: Show MongoDB startup logs
        if: always()
        run: docker compose logs --no-color --tail=200 mongo

      - name: Show application logs
        if: always()
        run: docker compose logs --no-color --tail=100 backend frontend

      - name: Clean up CI containers and database
        if: always()
        run: docker compose down --volumes --remove-orphans